# Single-process Loki for local/docker-compose use. auth_enabled: true means
# every push/query must carry X-Scope-OrgID -- same multi-tenancy contract
# as Mimir, enforced the same way by ingest-gateway/query-gateway.
auth_enabled: true

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /data/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  aws:
    endpoint: garage:3900
    region: garage
    bucketnames: loki
    access_key_id: ${GARAGE_ACCESS_KEY}
    secret_access_key: ${GARAGE_SECRET_KEY}
    s3forcepathstyle: true
    insecure: true

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
